<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>3PLUS | إدارة الصيانة</title><style>
:root{--bg:#0c0d10;--panel:#17191e;--gold:#ffd43b;--text:#f6f3e8;--muted:#a5a7ad;--line:#383a40;--red:#ff8181}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:20px}.brand{font-size:34px;font-weight:900;color:var(--gold)}.sub{color:var(--muted);font-size:13px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{background:var(--gold);color:#151515;border:0;border-radius:10px;padding:11px 15px;font-weight:bold}.alt{background:#292b30;color:var(--gold);border:1px solid #645a31}.danger{background:#4b2525;color:#fff}.nav button.active{background:var(--gold);color:#111}.section,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.card small{display:block;color:var(--muted);margin-bottom:10px}.card strong{font-size:23px;color:var(--gold)}h2{font-size:20px;color:var(--gold);margin:0 0 15px}label{display:block;color:#d9d3bb;margin-bottom:5px;font-size:13px}.field{margin-bottom:13px}input,select,textarea{width:100%;background:#0f1013;color:#fff;border:1px solid #4a4b4e;border-radius:9px;padding:11px}input:focus{outline:1px solid var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}td,th{padding:12px 8px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{color:var(--gold)}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.login{max-width:420px;margin:10vh auto}.error{color:var(--red);white-space:pre-wrap}.notice{border:1px solid #625a32;background:#25231b;border-radius:10px;padding:12px;margin:12px 0;color:#f4e6ad;font-size:13px}.foot{color:var(--muted);font-size:12px;margin-top:25px}dialog{background:var(--panel);color:#fff;border:1px solid #645a31;border-radius:14px;width:min(580px,96vw);max-height:90vh;overflow:auto;padding:20px}dialog::backdrop{background:#000b}@media(max-width:480px){.shell{padding:12px}.brand{font-size:28px}.card strong{font-size:19px}}
</style></head><body><div class="shell"><section id="login" class="section login"><div class="brand">3PLUS</div><p class="sub">نظام إدارة الصيانة السحابي</p><div class="field"><label>الإيميل المسجل في Supabase</label><input id="username" type="email" autocomplete="username" inputmode="email" placeholder="name@gmail.com"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">دخول</button><p id="loginError" class="error"></p></section><div id="app" class="hidden"><header><div><div class="brand">3PLUS</div><div class="sub" id="who"></div></div><button class="btn alt" id="logout">تسجيل خروج</button></header><nav class="nav" id="nav"></nav><div id="view"></div><p class="foot">البيانات متزامنة عبر Supabase. يوم العمل يبدأ الساعة 3:00 صباحًا بتوقيت القاهرة. التحويلات والسحوبات لا تُحسب مصروفات أرباح.</p></div></div><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions"><button class="btn" id="modalSave">حفظ</button><button class="btn alt" onclick="document.getElementById('modal').close()">إلغاء</button></div><p id="modalError" class="error"></p></dialog><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// Public client configuration. Never place secret/service_role keys in this file.
const SUPABASE_URL='https://hxozqjojfrumvrgzlyhc.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_CnIjkxKHAWXyHDqYVyalhg_x0IbS8AH';
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_ANON_KEY.startsWith('PASTE_');
const sb=configured?createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>(Number(x)||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج';
let user=null,profile=null,repairs=[],costs=[],events=[],page='dashboard',selectedDay=null;
const accounts={drawer:'درج المحل',vodafone:'فودافون كاش',instapay:'إنستا باي',personal:'معايا شخصيًا',safe:'الخزنة'};
const isAdmin=()=>profile?.role==='admin';
const cairoParts=stamp=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(stamp));return Object.fromEntries(p.map(x=>[x.type,x.value]));};
function workDay(stamp){const p=cairoParts(stamp),d=new Date(`${p.year}-${p.month}-${p.day}T12:00:00Z`);if(+p.hour<3)d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
const today=()=>workDay(new Date().toISOString());
const accountBalance=(a,until=null)=>events.filter(e=>e.account===a||e.destination===a).filter(e=>!until||workDay(e.created_at)<=until).reduce((v,e)=>v+(e.destination===a?+e.amount:0)+(e.account===a?(e.kind==='receipt'||e.kind==='opening'?+e.amount:-e.amount):0),0);
const paymentsFor=d=>events.filter(e=>e.kind==='receipt'&&workDay(e.created_at)===d);
const moneyCards=items=>`<div class="cards">${items.map(([a,b])=>`<div class="card"><small>${esc(a)}</small><strong>${esc(b)}</strong></div>`).join('')}</div>`;
const err=e=>alert(e?.message||String(e));
async function refresh(){const [r,e,c]=await Promise.all([sb.from('repairs').select('*').order('created_at',{ascending:false}),sb.from('cash_events').select('*').order('created_at',{ascending:false}),isAdmin()?sb.from('repair_costs').select('*'):Promise.resolve({data:[],error:null})]);for(const x of [r,e,c])if(x.error)throw x.error;repairs=r.data||[];events=e.data||[];costs=c.data||[];render()}
async function enter(){const {data:{user:u}}=await sb.auth.getUser();if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}user=u;const {data,error}=await sb.from('profiles').select('username,role').eq('id',u.id).single();if(error||!data){await sb.auth.signOut();$('login').classList.remove('hidden');$('app').classList.add('hidden');$('loginError').textContent='الحساب ليس له صلاحية دخول. اطلب من الأدمن إضافته.';return}profile=data;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=`${profile.username} • ${isAdmin()?'مدير':'موظف'}`;await refresh()}
$('loginBtn').onclick=async()=>{if(!configured){$('loginError').textContent='البرنامج يحتاج إعداد Supabase أولًا. افتح ملف التعليمات المرفق.';return}const email=$('username').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$('loginError').textContent='اكتب الإيميل اللي أنشأت به الحساب في Supabase';return}const b=$('loginBtn');b.disabled=true;$('loginError').textContent='';try{const {error}=await sb.auth.signInWithPassword({email,password:$('password').value});if(error)throw error;await enter()}catch(e){$('loginError').textContent='اسم المستخدم أو كلمة المرور غير صحيحة، أو إعداد الحساب غير مكتمل.'}finally{b.disabled=false}};
$('logout').onclick=async()=>{await sb.auth.signOut();user=null;profile=null;$('login').classList.remove('hidden');$('app').classList.add('hidden')};
const navs=[['dashboard','لوحة التحكم'],['repairs','الصيانات'],['cash','الدرج والحسابات'],['daily','التقفيل اليومي'],...(isAdmin()?[['monthly','الأرباح الشهرية']]:[])];
function render(){const n=[['dashboard','لوحة التحكم'],['repairs','الصيانات'],['cash','الدرج والحسابات'],['daily','التقفيل اليومي'],...(isAdmin()?[['monthly','الأرباح الشهرية']]:[])];if(!n.some(x=>x[0]===page))page='dashboard';$('nav').innerHTML=n.map(([k,v])=>`<button class="btn alt ${page===k?'active':''}" data-page="${k}">${v}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('view').innerHTML=({dashboard,repairs:repairView,cash:cashView,daily:dailyView,monthly:monthlyView})[page]();wire()}
function dashboard(){const d=today(),ps=paymentsFor(d),rs=repairs.filter(r=>workDay(r.created_at)===d);return `<div class="notice">يوم العمل الحالي: ${d} • يبدأ 3 الفجر بتوقيت القاهرة. الرصيد يُرحّل تلقائيًا لأنه مجموع حركات الخزنة عبر الأيام.</div>${moneyCards([['صيانات اليوم',rs.length],['تحصيلات اليوم',fmt(ps.reduce((s,e)=>s+ +e.amount,0))],['رصيد الدرج',fmt(accountBalance('drawer'))],['رصيد الخزنة',fmt(accountBalance('safe'))]])}<div class="section"><h2>أرصدة الحسابات</h2>${moneyCards(Object.entries(accounts).map(([k,v])=>[v,fmt(accountBalance(k))]))}</div><div class="section"><h2>آخر الصيانات</h2>${repairTable(repairs.slice(0,8))}</div>`}
function repairTable(rows){return `<div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>العميل</th><th>الجهاز</th><th>العطل</th><th>السعر</th><th>المقبوض</th>${isAdmin()?'<th>الجملة</th><th>الربح المتوقع</th>':''}<th>الإجراء</th></tr></thead><tbody>${rows.map(r=>{const received=events.filter(e=>e.repair_id===r.id&&e.kind==='receipt').reduce((a,e)=>a+ +e.amount,0),cost=costs.find(x=>x.repair_id===r.id)?.cost||0;return `<tr><td>${esc(workDay(r.created_at))}</td><td>${esc(r.client)}<div class="muted">${esc(r.phone)}</div></td><td>${esc(r.device)}</td><td>${esc(r.fault)}</td><td>${fmt(r.price)}</td><td>${fmt(received)}</td>${isAdmin()?`<td>${fmt(cost)}</td><td>${fmt(+r.price-cost)}</td>`:''}<td><button class="btn alt" data-receive="${r.id}">تحصيل</button></td></tr>`}).join('')}</tbody></table></div>`}
function repairView(){return `<div class="section"><div class="actions"><h2>سجل الصيانة</h2><button class="btn" id="addRepair">+ صيانة جديدة</button></div>${repairTable(repairs)}</div>`}
function cashView(){return `<div class="section"><h2>الأرصدة الحالية</h2>${moneyCards(Object.entries(accounts).map(([k,v])=>[v,fmt(accountBalance(k))]))}${isAdmin()?`<div class="actions"><button class="btn" data-cash="withdrawal">سحب فلوس</button><button class="btn alt" data-cash="transfer">تحويل بين الحسابات</button><button class="btn alt" data-cash="expense">مصروف</button><button class="btn danger" id="zeroDrawer">تصفير الدرج</button><button class="btn alt" data-cash="opening">رصيد افتتاحي</button></div>`:'<div class="notice">عمليات السحب والتصفير والتحويل متاحة للأدمن فقط.</div>'}</div><div class="section"><h2>سجل الحركات (لا يمكن مسحه)</h2>${eventTable(events)}</div>`}
function eventTable(rows){return `<div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>من</th><th>إلى</th><th>المبلغ</th><th>ملاحظات</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${esc(new Date(e.created_at).toLocaleString('ar-EG',{timeZone:'Africa/Cairo'}))}</td><td>${esc(({receipt:'تحصيل',expense:'مصروف',withdrawal:'سحب',transfer:'تحويل',opening:'رصيد افتتاحي'})[e.kind])}</td><td>${esc(accounts[e.account])}</td><td>${esc(accounts[e.destination]||'—')}</td><td>${fmt(e.amount)}</td><td>${esc(e.note)}</td></tr>`).join('')}</tbody></table></div>`}
function dailyView(){const d=selectedDay||today(),ps=paymentsFor(d),rows=events.filter(e=>workDay(e.created_at)===d),yesterday=new Date(`${d}T12:00:00Z`);yesterday.setUTCDate(yesterday.getUTCDate()-1);const prior=yesterday.toISOString().slice(0,10);return `<div class="section"><h2>تقفيل يوم العمل</h2><div class="field"><label>التاريخ</label><input type="date" id="dayPicker" value="${d}"></div>${moneyCards([['رصيد الدرج أول اليوم',fmt(accountBalance('drawer',prior))],['تحصيلات اليوم',fmt(ps.reduce((s,e)=>s+ +e.amount,0))],['رصيد الدرج آخر اليوم',fmt(accountBalance('drawer',d))],['عدد حركات اليوم',rows.length]])}<div class="notice">التقفيل تقرير تلقائي عند 3 الفجر وليس قفلًا نهائيًا للسجلات. الرصيد الختامي يصبح افتتاحيًا لليوم التالي.</div></div><div class="section"><h2>حركات اليوم</h2>${eventTable(rows)}</div>`}
function monthlyView(){const month=(selectedDay||today()).slice(0,7),rs=repairs.filter(r=>workDay(r.created_at).startsWith(month)),profit=rs.reduce((a,r)=>a+ +r.price-(+costs.find(c=>c.repair_id===r.id)?.cost||0),0),ps=events.filter(e=>e.kind==='receipt'&&workDay(e.created_at).startsWith(month));return `<div class="section"><h2>الأرباح الشهرية — ${month}</h2>${moneyCards([['عدد الصيانات',rs.length],['قيمة الصيانة',fmt(rs.reduce((s,r)=>s+ +r.price,0))],['تكلفة قطع الغيار',fmt(rs.reduce((s,r)=>s+(+costs.find(c=>c.repair_id===r.id)?.cost||0),0))],['الربح المتوقع',fmt(profit)],['المقبوض خلال الشهر',fmt(ps.reduce((s,e)=>s+ +e.amount,0))]])}<p class="muted">الربح المتوقع = سعر الصيانة ناقص الجملة. المصاريف التشغيلية تظهر في سجل الحركات ولا تُخصم من هذا المؤشر.</p></div>`}
function modal(title,html,save){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalError').textContent='';$('modalSave').onclick=async()=>{const b=$('modalSave');b.disabled=true;$('modalError').textContent='';try{await save();$('modal').close();await refresh()}catch(e){$('modalError').textContent=e.message||String(e)}finally{b.disabled=false}};$('modal').showModal()}
const field=(label,id,type='text',attrs='')=>`<div class="field"><label>${label}</label><input id="f_${id}" type="${type}" ${attrs}></div>`;
const select=(label,id,values)=>`<div class="field"><label>${label}</label><select id="f_${id}">${values.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`;
const val=id=>$('f_'+id).value;
const checkAmount=(a)=>{if(!Number.isFinite(a)||a<=0)throw Error('اكتب مبلغ صحيح أكبر من صفر')};
function wire(){document.querySelectorAll('[data-receive]').forEach(b=>b.onclick=()=>receive(b.dataset.receive));$('addRepair')?.addEventListener('click',addRepair);document.querySelectorAll('[data-cash]').forEach(b=>b.onclick=()=>cashAction(b.dataset.cash));$('zeroDrawer')?.addEventListener('click',()=>{const amount=accountBalance('drawer');if(amount<=0){alert('الدرج بالفعل صفر');return}cashAction('transfer',amount,'drawer')});$('dayPicker')?.addEventListener('change',e=>{selectedDay=e.target.value;render()})}
function addRepair(){modal('إضافة صيانة',`<div class="grid">${field('اسم العميل','client','text','required')}${field('رقم الهاتف','phone','tel')}${field('نوع الجهاز','device','text','required')}${field('العطل','fault','text','required')}${field('سعر الصيانة للعميل','price','number','min="0" step="0.01" value="0"')}${isAdmin()?field('تكلفة قطع الغيار (الجملة)','cost','number','min="0" step="0.01" value="0"'):''}</div>`,async()=>{const client=val('client').trim(),device=val('device').trim(),fault=val('fault').trim(),price=+val('price');if(!client||!device||!fault||!Number.isFinite(price)||price<0)throw Error('اكمل البيانات والسعر الصحيح');const {data,error}=await sb.from('repairs').insert({client,phone:val('phone').trim(),device,fault,price,created_by:user.id}).select('id').single();if(error)throw error;if(isAdmin()){const cost=+val('cost');if(!Number.isFinite(cost)||cost<0)throw Error('تكلفة غير صحيحة');const result=await sb.from('repair_costs').insert({repair_id:data.id,cost});if(result.error)throw result.error}})}
function receive(id){const r=repairs.find(x=>x.id===id),received=events.filter(e=>e.repair_id===id&&e.kind==='receipt').reduce((s,e)=>s+ +e.amount,0),remaining=+r.price-received;modal(`تحصيل من ${r.client} — المتبقي ${fmt(remaining)}`,`${field('المبلغ','amount','number','min="0.01" step="0.01"')}${select('طريقة التحصيل','account',[['drawer','كاش في الدرج'],['vodafone','فودافون كاش'],['instapay','إنستا باي']])}${field('ملاحظة','note')}`,async()=>{const amount=+val('amount');checkAmount(amount);if(amount>remaining+0.001)throw Error('المبلغ أكبر من المتبقي على العميل');const {error}=await sb.from('cash_events').insert({kind:'receipt',repair_id:id,account:val('account'),amount,note:val('note').trim(),created_by:user.id});if(error)throw error})}
function cashAction(kind,fixed=null,from=null){if(!isAdmin())return;const options=Object.entries(accounts);const label={withdrawal:'سحب فلوس',transfer:'تحويل / تصفير',expense:'تسجيل مصروف',opening:'إضافة رصيد افتتاحي'}[kind];modal(label,`${select('الحساب','account',options)}${kind==='transfer'?select('الحساب المستلم','destination',options):''}${field('المبلغ','amount','number',`min="0.01" step="0.01" ${fixed!==null?`value="${fixed}" readonly`:''}`)}${field('السبب أو الملاحظة','note')}`,async()=>{const amount=+val('amount'),account=val('account'),destination=kind==='transfer'?val('destination'):null;checkAmount(amount);if(kind!=='opening'&&amount>accountBalance(account)+0.001)throw Error('الرصيد غير كافٍ');if(kind==='transfer'&&destination===account)throw Error('اختار حساب مختلف');if(!confirm(`تأكيد ${label} بمبلغ ${fmt(amount)}؟`))throw Error('تم إلغاء العملية');const {error}=await sb.from('cash_events').insert({kind,account,destination,amount,note:val('note').trim(),created_by:user.id});if(error)throw error});if(from)$('f_account').value=from;if(fixed!==null){$('f_destination').value='personal';$('f_note').value='تصفير درج المحل وتحويل الرصيد'}}
if(!configured){$('loginError').textContent='نسخة البرنامج جاهزة للربط. أضف إعدادات Supabase داخل index.html أولًا.'}else{sb.auth.onAuthStateChange((_event,session)=>{if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden')}});enter().catch(err)}
</script></body></html>
