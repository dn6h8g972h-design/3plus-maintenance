<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>3PLUS | إدارة الصيانة</title><style>
:root{--bg:#0c0d10;--panel:#17191e;--panel2:#202329;--gold:#ffd43b;--text:#f6f3e8;--muted:#a5a7ad;--line:#36383d;--green:#67d9a0;--red:#ff8181}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#131418;border-left:1px solid var(--line);padding:25px 16px}.brand{font-weight:900;color:var(--gold);font-size:34px;text-align:center;letter-spacing:1px}.sub{text-align:center;color:var(--muted);font-size:12px;margin:4px 0 34px}.nav{display:block;width:100%;text-align:right;border:0;background:none;color:var(--text);padding:15px;border-radius:12px;margin:6px 0}.nav.active,.nav:hover{background:#29271d;color:var(--gold)}main{padding:26px;max-width:1550px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}h1{font-size:25px;margin:0}h2{font-size:19px;margin:0 0 18px;color:var(--gold)}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:10px;background:var(--gold);color:#171717;padding:11px 18px;font-weight:bold}.btn.alt{background:var(--panel2);color:var(--gold);border:1px solid #615728}.btn.danger{background:#4c2525;color:#fff}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:22px}.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px}.card small{display:block;color:var(--muted);margin-bottom:12px}.card strong{color:var(--gold);font-size:25px}.section{margin-bottom:18px;overflow:auto}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field label{color:#d4d0bf;font-size:13px}input,select,textarea{width:100%;background:#0f1013;color:var(--text);border:1px solid #4a4b4e;border-radius:9px;padding:11px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.span{grid-column:1/-1}table{border-collapse:collapse;width:100%;min-width:780px}th,td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{color:var(--gold);background:#202126;white-space:nowrap}td{color:#e8e8e8}.pill{padding:5px 8px;border-radius:8px;background:#303027;color:var(--gold);white-space:nowrap}.actions{display:flex;gap:7px}.tiny{border:1px solid #5a532d;background:#26251f;color:var(--gold);padding:7px 9px;border-radius:8px}.hidden{display:none!important}.notice{border:1px solid #615728;background:#242319;color:#f7e9a7;padding:13px;border-radius:10px;margin:15px 0;font-size:13px}.empty{text-align:center;padding:35px;color:var(--muted)}.foot{font-size:12px;color:var(--muted);margin-top:25px}.mobilebar{display:none}.total{color:var(--gold);font-weight:bold}dialog{background:var(--panel);color:var(--text);border:1px solid #6d5e23;border-radius:16px;width:min(740px,96vw);max-height:92vh;overflow:auto;padding:22px}dialog::backdrop{background:#000b}.dialogtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{background:none;border:0;color:white;font-size:27px}#toast{position:fixed;bottom:20px;left:20px;background:#333021;color:var(--gold);padding:13px;border-radius:10px;display:none;z-index:5}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.side{display:none}main{padding:16px;padding-bottom:90px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#17181b;border-top:1px solid var(--line);justify-content:space-around;padding:7px 3px;z-index:3}.mobilebar button{background:none;border:0;color:var(--gold);font-size:11px;padding:9px 4px}}@media(max-width:480px){.cards{gap:8px}.card{padding:13px}.card strong{font-size:19px}.grid,.grid.two{grid-template-columns:1fr}h1{font-size:21px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">3PLUS</div><div class="sub">نظام إدارة صيانة الأجهزة</div><div id="sideNav"></div></aside><main><div class="top"><div><h1 id="pageTitle">لوحة التحكم</h1><div class="muted" id="clock"></div></div><button class="btn" onclick="openRepair()">+ إضافة صيانة</button></div><div id="view"></div><div class="foot">3PLUS • البيانات محفوظة محليًا على هذا الجهاز والمتصفح. استخدم النسخ الاحتياطي بانتظام.</div></main></div><nav class="mobilebar" id="mobileNav"></nav><dialog id="repairDialog"><div class="dialogtop"><h2 id="dialogTitle">إضافة صيانة</h2><button class="close" onclick="document.getElementById('repairDialog').close()">×</button></div><form id="repairForm"><input type="hidden" id="repairId"><div class="grid"><div class="field"><label>اسم العميل *</label><input id="client" required></div><div class="field"><label>رقم الهاتف</label><input id="phone" inputmode="tel"></div><div class="field"><label>نوع الجهاز والموديل *</label><input id="device" required></div><div class="field span"><label>العطل *</label><input id="fault" required></div><div class="field"><label>تاريخ ووقت تسجيل الصيانة *</label><input id="created" type="datetime-local" required></div><div class="field"><label>سعر الصيانة للعميل (جنيه) *</label><input id="price" type="number" min="0" step="0.01" required value="0"></div><div class="field"><label>تكلفة قطع الغيار (جنيه)</label><input id="cost" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>العربون (جنيه)</label><input id="deposit" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>تحصيل إضافي (جنيه)</label><input id="additional" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>طريقة دفع العربون</label><select id="depositMethod"><option>كاش</option><option>فودافون كاش</option><option>إنستا باي</option></select></div><div class="field"><label>طريقة دفع التحصيل الإضافي</label><select id="additionalMethod"><option>كاش</option><option>فودافون كاش</option><option>إنستا باي</option></select></div><div class="field"><label>الفلوس مع مين؟</label><input id="holder" placeholder="مثلاً: صبري / درج المحل"></div><div class="field"><label>تاريخ ووقت العربون (إن وجد)</label><input id="depositAt" type="datetime-local"></div><div class="field"><label>تاريخ ووقت التحصيل الإضافي (إن وجد)</label><input id="additionalAt" type="datetime-local"></div></div><p class="muted">الربح المتوقع = سعر الصيانة − تكلفة القطع. المقبوض = العربون + التحصيل الإضافي. التقارير المالية للمقبوض تعتمد على تاريخ كل دفعة.</p><div class="toolbar"><button class="btn" type="submit">حفظ الصيانة</button><button type="button" class="btn alt" onclick="document.getElementById('repairDialog').close()">إلغاء</button></div></form></dialog><input id="importFile" type="file" accept="application/json,.json" class="hidden"><div id="toast"></div><script>
const KEY='threeplus_repairs_v1', SET='threeplus_settings_v1';let repairs=read(KEY,[]),settings=read(SET,{closing:'03:00'}),page='dashboard';const navs=[['dashboard','⌂ لوحة التحكم'],['repairs','▤ سجل الصيانة'],['daily','◷ التقفيل اليومي'],['monthly','▦ الأرباح الشهرية'],['settings','⚙ الإعدادات']];function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function persist(){localStorage.setItem(KEY,JSON.stringify(repairs));localStorage.setItem(SET,JSON.stringify(settings))}function money(n){return (Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج'}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function localStamp(d=new Date()){let p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}function dayFor(s){if(!s)return '';let d=new Date(s);if(isNaN(d))return '';let [h,m]=settings.closing.split(':').map(Number);if(d.getHours()*60+d.getMinutes()<h*60+m)d.setDate(d.getDate()-1);return localStamp(d).slice(0,10)}function today(){return dayFor(localStamp())}function payments(r){return [{amount:+r.deposit||0,at:r.depositAt||r.created,method:r.depositMethod||'كاش',holder:r.holder||''},{amount:+r.additional||0,at:r.additionalAt||r.created,method:r.additionalMethod||'كاش',holder:r.holder||''}].filter(p=>p.amount>0)}function sum(a,fn){return a.reduce((t,x)=>t+fn(x),0)}function totals(list){return {count:list.length,price:sum(list,r=>+r.price||0),cost:sum(list,r=>+r.cost||0),profit:sum(list,r=>(+r.price||0)-(+r.cost||0)),received:sum(list,r=>(+r.deposit||0)+(+r.additional||0))}}function cards(items){return `<div class="cards">${items.map(([label,value])=>`<div class="card"><small>${label}</small><strong>${value}</strong></div>`).join('')}</div>`}function notice(s){return `<div class="notice">${s}</div>`}function render(){document.getElementById('pageTitle').textContent=navs.find(n=>n[0]===page)[1].replace(/^[^ ]+ /,'');document.getElementById('sideNav').innerHTML=navs.map(n=>`<button class="nav ${page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');document.getElementById('mobileNav').innerHTML=navs.map(n=>`<button onclick="go('${n[0]}')">${n[1]}</button>`).join('');let v=document.getElementById('view');if(page==='dashboard')v.innerHTML=dashboard();if(page==='repairs')v.innerHTML=repairPage();if(page==='daily')v.innerHTML=dailyPage();if(page==='monthly')v.innerHTML=monthlyPage();if(page==='settings')v.innerHTML=settingsPage();}function go(p){page=p;render();window.scrollTo(0,0)}function dashboard(){let t=totals(repairs),d=today(),todayR=repairs.filter(r=>dayFor(r.created)===d),paid=allPayments().filter(p=>dayFor(p.at)===d),todayCollected=sum(paid,p=>p.amount);return cards([['إجمالي عمليات الصيانة',t.count],['إجمالي قيمة الصيانة',money(t.price)],['صافي الربح المتوقع',money(t.profit)],['المتبقي على العملاء',money(t.price-t.received)]])+cards([['صيانة يوم العمل الحالي',todayR.length],['مقبوض يوم العمل الحالي',money(todayCollected)],['تكلفة قطع الغيار الإجمالية',money(t.cost)],['المقبوض الكلي',money(t.received)]])+notice(`يوم العمل الحالي: ${d} • يبدأ وينتهي عند الساعة ${settings.closing}. يتم تصنيف العمليات حسب وقتها تلقائيًا، دون قفل نهائي يمنع تعديلها.`)+`<div class="section"><h2>آخر عمليات الصيانة</h2>${repairTable([...repairs].sort((a,b)=>b.created.localeCompare(a.created)).slice(0,8))}</div>`}function repairPage(){return `<div class="section"><div class="toolbar"><input style="max-width:360px" id="search" placeholder="ابحث باسم العميل أو الهاتف أو الجهاز" oninput="filterRepairs()"><button class="btn" onclick="openRepair()">+ صيانة جديدة</button></div><div id="repairRows">${repairTable(repairs)}</div></div>`}function repairTable(a){if(!a.length)return `<div class="empty">لا توجد عمليات صيانة بعد. ابدأ بإضافة أول جهاز.</div>`;return `<table><thead><tr><th>التاريخ</th><th>العميل</th><th>الهاتف</th><th>الجهاز</th><th>العطل</th><th>السعر</th><th>المقبوض</th><th>المتبقي</th><th>الربح</th><th>إجراءات</th></tr></thead><tbody>${a.map(r=>{let rec=(+r.deposit||0)+(+r.additional||0);return `<tr><td>${safe(r.created.replace('T',' '))}</td><td>${safe(r.client)}</td><td>${safe(r.phone)}</td><td>${safe(r.device)}</td><td>${safe(r.fault)}</td><td>${money(r.price)}</td><td>${money(rec)}</td><td class="total">${money(r.price-rec)}</td><td>${money(r.price-r.cost)}</td><td><div class="actions"><button class="tiny" onclick="openRepair('${r.id}')">تعديل</button><button class="tiny" onclick="removeRepair('${r.id}')">حذف</button></div></td></tr>`}).join('')}</tbody></table>`}function filterRepairs(){let q=document.getElementById('search').value.trim().toLowerCase();document.getElementById('repairRows').innerHTML=repairTable(repairs.filter(r=>[r.client,r.phone,r.device,r.fault].some(x=>String(x).toLowerCase().includes(q))))}function allPayments(){return repairs.flatMap(r=>payments(r).map(p=>({...p,client:r.client,device:r.device})))}function dailyPage(){let date=window.selectedDay||today();let rs=repairs.filter(r=>dayFor(r.created)===date),t=totals(rs),ps=allPayments().filter(p=>dayFor(p.at)===date),collected=sum(ps,p=>p.amount);return `<div class="section"><div class="toolbar"><div class="field"><label>اختار يوم العمل</label><input type="date" value="${date}" onchange="window.selectedDay=this.value;render()"></div><button class="btn alt" onclick="window.print()">طباعة التقرير</button></div>${cards([['أجهزة مسجلة',t.count],['قيمة صيانة الأجهزة',money(t.price)],['تكلفة القطع',money(t.cost)],['ربح الصيانة المتوقع',money(t.profit)]])}${cards([['المقبوض فعليًا في اليوم',money(collected)],['كاش',money(sum(ps.filter(p=>p.method==='كاش'),p=>p.amount))],['فودافون كاش',money(sum(ps.filter(p=>p.method==='فودافون كاش'),p=>p.amount))],['إنستا باي',money(sum(ps.filter(p=>p.method==='إنستا باي'),p=>p.amount))]])}${notice('المقبوض يحسب بتاريخ كل دفعة، حتى لو الصيانة اتسجلت في يوم مختلف. الربح المعروض ربح متوقع لعمليات الصيانة المسجلة في اليوم وليس ربحًا نقديًا محققًا.')}</div><div class="section"><h2>تفاصيل المقبوضات</h2>${paymentTable(ps)}</div><div class="section"><h2>أجهزة اليوم</h2>${repairTable(rs)}</div>`}function paymentTable(ps){return ps.length?`<table><thead><tr><th>وقت الدفع</th><th>العميل</th><th>الجهاز</th><th>المبلغ</th><th>الطريقة</th><th>الفلوس مع مين</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${safe(p.at.replace('T',' '))}</td><td>${safe(p.client)}</td><td>${safe(p.device)}</td><td>${money(p.amount)}</td><td>${safe(p.method)}</td><td>${safe(p.holder)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">لا توجد تحصيلات في الفترة المحددة</div>`}function monthlyPage(){let month=window.selectedMonth||today().slice(0,7),rs=repairs.filter(r=>dayFor(r.created).startsWith(month)),t=totals(rs),ps=allPayments().filter(p=>dayFor(p.at).startsWith(month)),days=[...new Set([...rs.map(r=>dayFor(r.created)),...ps.map(p=>dayFor(p.at))])].sort();return `<div class="section"><div class="toolbar"><div class="field"><label>الشهر</label><input type="month" value="${month}" onchange="window.selectedMonth=this.value;render()"></div><button class="btn alt" onclick="window.print()">طباعة التقرير</button></div>${cards([['عدد الأجهزة',t.count],['إجمالي قيمة الصيانة',money(t.price)],['تكلفة القطع',money(t.cost)],['الربح المتوقع',money(t.profit)]])}${cards([['المقبوض خلال الشهر',money(sum(ps,p=>p.amount))],['كاش',money(sum(ps.filter(p=>p.method==='كاش'),p=>p.amount))],['فودافون كاش',money(sum(ps.filter(p=>p.method==='فودافون كاش'),p=>p.amount))],['إنستا باي',money(sum(ps.filter(p=>p.method==='إنستا باي'),p=>p.amount))]])}${notice('التقرير يفصل بين تاريخ تسجيل الصيانة وتاريخ قبض الفلوس، حتى تكون حسابات اليومية أدق.')}</div><div class="section"><h2>تفصيل الأيام</h2><table><thead><tr><th>يوم العمل</th><th>عدد الأجهزة</th><th>قيمة الصيانة</th><th>التكاليف</th><th>الربح المتوقع</th><th>المقبوض</th></tr></thead><tbody>${days.map(d=>{let x=totals(rs.filter(r=>dayFor(r.created)===d));return `<tr><td>${d}</td><td>${x.count}</td><td>${money(x.price)}</td><td>${money(x.cost)}</td><td>${money(x.profit)}</td><td>${money(sum(ps.filter(p=>dayFor(p.at)===d),p=>p.amount))}</td></tr>`}).join('')}</tbody></table></div>`}function settingsPage(){return `<div class="section"><h2>إعدادات يوم العمل</h2><div class="grid two"><div class="field"><label>ساعة بداية يوم العمل الجديد</label><input id="closing" type="time" value="${settings.closing}"></div></div><p class="muted">مثال: لو اخترت 03:00، أي عملية الساعة 02:30 صباحًا تُحسب على يوم العمل السابق. البرنامج لا ينفذ قفلًا غير قابل للتعديل.</p><button class="btn" onclick="saveSettings()">حفظ الإعدادات</button></div><div class="section"><h2>النسخ الاحتياطي ونقل البيانات</h2>${notice('البيانات موجودة على المتصفح الحالي فقط. لا تنتقل تلقائيًا بين الموبايل والكمبيوتر. صدّر نسخة احتياطية واستوردها على الجهاز الآخر. الاستيراد يستبدل البيانات الحالية.') }<div class="toolbar"><button class="btn" onclick="exportData()">تنزيل نسخة احتياطية JSON</button><button class="btn alt" onclick="document.getElementById('importFile').click()">استيراد نسخة احتياطية</button></div></div>`}function saveSettings(){settings.closing=document.getElementById('closing').value||'03:00';persist();toast('تم حفظ الإعدادات');render()}function openRepair(id){let r=repairs.find(x=>x.id===id)||{};document.getElementById('repairForm').reset();document.getElementById('dialogTitle').textContent=id?'تعديل بيانات الصيانة':'إضافة صيانة جديدة';for(let k of ['client','phone','device','fault','price','cost','deposit','additional','depositMethod','additionalMethod','holder','depositAt','additionalAt','created']){let el=document.getElementById(k);el.value=r[k]??(['price','cost','deposit','additional'].includes(k)?'0':k==='created'?localStamp():k==='depositMethod'||k==='additionalMethod'?'كاش':'')}document.getElementById('repairId').value=id||'';document.getElementById('repairDialog').showModal()}document.getElementById('repairForm').onsubmit=e=>{e.preventDefault();let r={};for(let k of ['client','phone','device','fault','price','cost','deposit','additional','depositMethod','additionalMethod','holder','depositAt','additionalAt','created'])r[k]=document.getElementById(k).value.trim();for(let k of ['price','cost','deposit','additional'])r[k]=+r[k]||0;if(r.deposit+r.additional>r.price){alert('المقبوض لا يمكن أن يزيد عن سعر الصيانة');return}if(r.deposit&&!r.depositAt)r.depositAt=r.created;if(r.additional&&!r.additionalAt)r.additionalAt=r.created;let id=document.getElementById('repairId').value;r.id=id||('r'+Date.now()+Math.random().toString(36).slice(2));if(id){repairs=repairs.map(x=>x.id===id?r:x)}else repairs.push(r);persist();document.getElementById('repairDialog').close();toast('تم حفظ الصيانة');render()};function removeRepair(id){if(confirm('متأكد من حذف عملية الصيانة وكل تحصيلاتها؟')){repairs=repairs.filter(r=>r.id!==id);persist();render()}}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}function exportData(){let b=new Blob([JSON.stringify({version:1,repairs,settings,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='3PLUS-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}document.getElementById('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.repairs)||!data.settings||typeof data.settings.closing!=='string'||!data.repairs.every(r=>r&&typeof r.id==='string'&&typeof r.client==='string'&&typeof r.created==='string'))throw Error('ملف غير صالح');if(confirm('سيتم استبدال كل بيانات هذا المتصفح بالنسخة المستوردة. هل تريد المتابعة؟')){repairs=data.repairs;settings=data.settings;persist();render();toast('تم الاستيراد')}}catch(err){alert('تعذر استيراد الملف: '+err.message)}e.target.value=''};function clock(){document.getElementById('clock').textContent=new Date().toLocaleString('ar-EG')+' • يوم العمل '+today()}clock();setInterval(clock,30000);render();
</script></body></html>
